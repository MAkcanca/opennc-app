[package]
name = "opennc-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "OpenNC desktop: real-time open-source noise cancellation into a virtual microphone"
license = "Apache-2.0"
default-run = "opennc"
build = "build.rs"

[lib]
name = "opennc"
path = "src/lib.rs"

[[bin]]
name = "opennc"
path = "src/main.rs"

[[bin]]
name = "opennc-cli"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1"
cpal = "0.18"
hound = "3.5"
ort = { version = "=2.0.0-rc.14", features = ["download-binaries"] }
realfft = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.18"

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
